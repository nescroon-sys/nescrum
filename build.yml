name: Build NESCRUN (Windows VST3)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --parallel 4 --target NESCRUN_VST3 NESCRUN_Standalone

      - name: Validate with pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 300000 --output-dir pluginval-logs "build/NESCRUN_artefacts/Release/VST3/NESCRUN.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/NESCRUN_artefacts/Release/VST3/NESCRUN.vst3" dist/
          Copy-Item "build/NESCRUN_artefacts/Release/Standalone/NESCRUN.exe" dist/
          Copy-Item INSTALAR.txt dist/
          Compress-Archive -Path dist/* -DestinationPath NESCRUN-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NESCRUN-Windows-x64
          path: NESCRUN-Windows-x64.zip

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NESCRUN v1.0.${{ github.run_number }}
          body: |
            Plugin VST3 de 64 bits para Windows (FL Studio, Ableton, Reaper, Studio One...).
            Descarga **NESCRUN-Windows-x64.zip** y segui las instrucciones de INSTALAR.txt.
          files: NESCRUN-Windows-x64.zip
          make_latest: true
